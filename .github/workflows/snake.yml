name: Generate Snake

# Genera la animación de la culebrita que recorre tu contribution graph
# Basado en https://github.com/Platane/snk

on:
  schedule:
    # cada 24 horas a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake files
        uses: Platane/snk@v0.6.1
        with:
          github_user_name: juankAnez
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#639922&color_dots=#3B6D11,#639922,#8CC84B,#B6E880,#E0F5C0
          # opcional: solo branch output
          # ver https://github.com/Platane/snk#github-action

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
